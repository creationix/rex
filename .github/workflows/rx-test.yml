name: rx tests

on:
  push:
    paths:
      - 'packages/rx-format/**'
      - '.github/workflows/rx-test.yml'
  pull_request:
    paths:
      - 'packages/rx-format/**'
      - '.github/workflows/rx-test.yml'

jobs:
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
        working-directory: packages/rx-format

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify import and round-trip
        run: |
          node --input-type=module -e "
            import { encode, open } from './packages/rx-format/rx.ts';
            const buf = encode({a:1});
            const val = open(buf);
            if (val.a !== 1) { console.log('FAIL'); process.exit(1); }
            console.log('PASS');
          "
