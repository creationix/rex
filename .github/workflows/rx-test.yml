name: rx tests

on:
  push:
    paths:
      - 'packages/rx-format/**'
      - '.github/workflows/rx-test.yml'
  pull_request:
    paths:
      - 'packages/rx-format/**'
      - '.github/workflows/rx-test.yml'

jobs:
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
        working-directory: packages/rx-format

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npx vitest run
        working-directory: packages/rx-format
