<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REXC Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      color: #ccc;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #252526;
      border-bottom: 1px solid #333;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
    }

    #status {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 3px;
    }

    #status.ok {
      color: #4ec9b0;
    }

    #status.error {
      color: #f48771;
    }

    .options {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 16px;
      background: #252526;
      border-bottom: 1px solid #333;
      font-size: 11px;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
    }

    .options input[type="checkbox"] {
      margin: 0;
      accent-color: #4ec9b0;
    }

    .panes {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .pane+.pane {
      border-left: 1px solid #333;
    }

    .pane label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 12px;
      background: #2d2d2d;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
    }

    .pane label .name {
      cursor: pointer;
    }

    .pane label .name:hover {
      color: #fff;
    }

    .pane label .size {
      text-transform: none;
      color: #888;
    }

    #rexc {
      flex: 1;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      min-height: 0;
    }

    #rexc.valid {
      box-shadow: inset 0 0 0 2px #4ec9b0;
    }

    #rexc.error {
      box-shadow: inset 0 0 0 2px #f48771;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      padding: 12px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      line-height: 1.5;
      background: #1e1e1e;
      color: #d4d4d4;
      tab-size: 2;
    }

    textarea::placeholder {
      color: #555;
    }

    #json-editor {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #json-editor .cm-editor {
      height: 100%;
      outline: none;
    }

    #json-editor .cm-editor.cm-focused {
      outline: none;
    }

    #json-editor .cm-scroller {
      overflow: auto;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    #json-editor.valid {
      box-shadow: inset 0 0 0 2px #4ec9b0;
    }

    #json-editor.error {
      box-shadow: inset 0 0 0 2px #f48771;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #252526;
      border: 1px solid #444;
      border-radius: 6px;
      width: 560px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid #333;
      font-size: 13px;
      font-weight: 600;
    }

    .modal-header button {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }

    .modal-header button:hover {
      color: #fff;
    }

    .modal-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .modal-body textarea {
      flex: 1;
      min-height: 200px;
      border-radius: 0;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-top: 1px solid #333;
      font-size: 11px;
    }

    .modal-footer .refs-status {
      color: #888;
    }

    .modal-footer .refs-status.refs-error {
      color: #f48771;
    }

    .refs-btn {
      background: #333;
      border: 1px solid #555;
      color: #ccc;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
    }

    .refs-btn:hover {
      background: #444;
      color: #fff;
    }
  </style>
</head>

<body>
  <header>
    <h1>REXC Viewer</h1>
    <span id="status" class="ok">OK</span>
  </header>
  <div class="options">
    <span style="color:#888">Encode:</span>
    <label><input type="checkbox" id="opt-bareStrings" checked> bareStrings</label>
    <label><input type="checkbox" id="opt-pointers" checked> pointers</label>
    <label><input type="checkbox" id="opt-schemas" checked> schemas</label>
    <label><input type="checkbox" id="opt-pathChains" checked> pathChains</label>
    <label>idxThresh <input type="number" id="opt-indexes" value="10" min="0"
        style="width:40px; background:#333; color:#ccc; border:1px solid #555; border-radius:2px; padding:1px 4px; font-size:11px;"></label>
    <span style="color:#555">|</span>
    <label><input type="checkbox" id="opt-reverse"> reverse</label>
    <label><input type="checkbox" id="opt-refsEnabled"> <button class="refs-btn" id="refs-btn">refs {}</button></label>
    <span style="color:#555">|</span>
    <span style="color:#888">Decode:</span>
    <label><input type="checkbox" id="opt-lazy" checked> lazy</label>
  </div>
  <div class="modal-overlay" id="refs-modal">
    <div class="modal">
      <div class="modal-header">
        <span>Edit refs (JSON object with b64 keys)</span>
        <button id="refs-close">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="refs-editor" spellcheck="false" placeholder="{}">{}</textarea>
      </div>
      <div class="modal-footer">
        <span class="refs-status" id="refs-status">OK</span>
        <button class="refs-btn" id="refs-apply">Apply &amp; Close</button>
      </div>
    </div>
  </div>
  <div class="panes">
    <div class="pane">
      <label><span class="name" id="copy-rexc">REXC</span> <span class="size" id="rexc-size">0 B</span></label>
      <div id="rexc"></div>
    </div>
    <div class="pane">
      <label><span class="name" id="copy-json">JSON</span> <span class="size" id="json-size">0 B</span></label>
      <div id="json-editor"></div>
    </div>
  </div>
  <script type="module" src="./dist/main.js"></script>
</body>

</html>
